server:
  port: 8765

spring:
  application:
    name: API_GATEWAY
  cloud:
    gateway:
      routes:
        - id: USER_MICROSERVICE
          uri: lb://USER_MICROSERVICE
          predicates:
            - Path=/user/**
          filters:
            - name: AuthenticationFilterFactory
      discovery:
        locator:
          enabled: true
#              lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    enabled: true
  instance:
    prefer-ip-address: true
    hostname: localhost

logging:
  level:
    com.netflix.discovery: DEBUG
    org.springframework.cloud: DEBUG