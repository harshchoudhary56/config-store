server:
  port: 8765

spring:
  application:
    name: API_GATEWAY
  cloud:
    gateway:
      routes:
        - id: USER_MICROSERVICE
          uri: lb://USER_MICROSERVICE
          predicates:
            - Path=/user/**
          filters:
            - name: AuthenticationFilter
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
