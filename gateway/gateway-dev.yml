server:
  port: 8765

spring:
  application:
    name: API-GATEWAY
  data:
    mongodb:
      uri: mongodb://localhost:27017/school_erp_gateway
      database: school_erp_gateway
  liquibase:
    enabled: false
  cloud:
    gateway:
      routes:
        - id: USER-MICROSERVICE
          uri: lb://USER-MICROSERVICE
          predicates:
            - Path=/user/**
          filters:
            - name: AuthenticationFilter
            - name: RateLimiterFilter
              args:
                strategy: TOKEN_BUCKET
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
