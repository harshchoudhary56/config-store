server:
  port: 8765

spring:
  application:
    name: API-GATEWAY


  cloud:
    gateway:
      routes:
        - id: USER_MICROSERVICE
          uri: lb://USER_MICROSERVICE
          predicates:
            - Path=/user/**
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
